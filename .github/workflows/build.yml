name: Compilar ElisioUnlockMaster .exe

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Verificar arquivos do projeto
        shell: cmd
        run: |
          echo ===== RAIZ DO PROJETO =====
          dir
          echo.
          echo ===== BIN =====
          dir bin
          echo.
          echo ===== DRIVERS =====
          dir drivers

      - name: Verificar client.py
        shell: cmd
        run: |
          python -m py_compile client.py

      - name: Compilar ElisioUnlockMaster
        shell: cmd
        run: |
          pyinstaller ^
            --noconsole ^
            --onefile ^
            --clean ^
            --name "ElisioUnlockMaster" ^
            --icon "icon.ico" ^
            client.py

      - name: Verificar executável
        shell: cmd
        run: |
          if not exist "dist\ElisioUnlockMaster.exe" (
            echo ERRO: O executável não foi criado.
            exit /b 1
          )
          dir "dist\ElisioUnlockMaster.exe"

      - name: Guardar executável
        uses: actions/upload-artifact@v4
        with:
          name: ElisioUnlockMaster-Windows
          path: dist/ElisioUnlockMaster.exe
          if-no-files-found: error
